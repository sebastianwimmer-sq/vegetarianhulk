# vh-forms — Formular-Endpoint für vegetarianhulk.de (Brand-Anfrage)
# Deploy:  cd workers/vh-forms && wrangler deploy
# Secret:  wrangler secret put BREVO_API_KEY   (gleicher Key wie Newsletter-Brevo)
# Secret:  wrangler secret put TURNSTILE_SECRET (optional — aktiviert CAPTCHA-Verify;
#          Sitekey dazu gehört in newsletter-form.js TURNSTILE_SITEKEY)
name = "vh-forms"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
NL_LIST_ID = "5"              # Brevo-Liste vegetarianhulk-discipline-reset (#5)
NL_REDIRECT_URL = "https://vegetarianhulk.de/"   # Ziel nach Bestätigungs-Klick

# doi-template.html als Text importierbar machen (Quelle: email-templates/confirm-doi.html)
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
