  /* Forest-Family-Interstitial — self-contained (lebt nur ~2 s, kein style.css).

  :root {
    --vanilla: #f7efde;
    --ink: #1a1410;

  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;

  }
  .wordmark {
    font-size: 13px; font-weight: 800; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--forest-anchor);
  }
  .wordmark .accent { color: var(--forest-primary); }
  h1 {

  .msg strong { color: var(--forest-primary); }
  .redirect-note { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); }
  .go {
    display: inline-block; margin-top: 20px; padding: 13px 28px;
    background: linear-gradient(180deg, var(--forest-primary), var(--forest-anchor));
    color: var(--vanilla); text-decoration: none; font-weight: 800; font-size: 15px;
    border-radius: 12px; box-shadow: 0 8px 20px -8px rgba(4, 89, 39, 0.4);
  }
  .go:focus-visible { outline: 3px solid var(--forest-primary); outline-offset: 2px; }
  .fallback { margin-top: 18px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
  .fallback a { color: var(--forest-primary); }

<script>
(function () {
  'use strict';
  var SLUG = 'nature-heart';
  var REDIRECT_MS = 2000;
  // partners.js = Quelle der Wahrheit; statisches href bleibt Fallback
  var partner = (typeof VH_PARTNERS !== 'undefined')
    ? VH_PARTNERS.filter(function (p) { return p.slug === SLUG; })[0]

})();
