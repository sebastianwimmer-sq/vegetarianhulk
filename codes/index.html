<link rel="stylesheet" href="/fonts.css">

<style>
  /* codes/ — Dark-Forest Bio-Link-Page (page-scoped, lädt style.css bewusst NICHT).
     Token-Block synced auf Hybrid Forest Family v31 (siehe style.css :root). */
  :root {
    --forest-anchor:  #122d1c;  /* = --forest-anchor (Foto-BG-Reality) */
    --forest-deepest: #0b1d12;  /* Gradient-Endstop, abgeleitet von anchor */
    --forest-primary: #045927;  /* = --forest-primary (Brand-Action) */
    --forest-accent:  #1a7340;  /* = --forest-accent (Detail-Brights) */
    --vanilla:        #f7efde;  /* = --vanilla (Headlines, CTA-Fläche) */
    --sage:           #a8c5a1;  /* Secondary-Text auf Dark-Surface (page-only) */
    --line:           rgba(247, 239, 222, 0.14);
    --radius:         16px;
    --font-display:   'Playfair Display', Georgia, serif;
    --font-body:      'Inter', -apple-system, system-ui, sans-serif;
    --font-mono:      ui-monospace, 'SF Mono', Menlo, monospace;
    --ease-out-quart: cubic-bezier(0.165, 0.84, 0.44, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: radial-gradient(120% 70% at 50% -10%, #14442f 0%, var(--forest-anchor) 60%, var(--forest-deepest) 100%);
    background-color: var(--forest-anchor);
    color: var(--vanilla);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
    padding: 0 18px 56px;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 440px; }

  /* header */
  header { padding: 46px 4px 14px; text-align: center; }
  .monogram {
    width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 22px; color: var(--sage);
    background: rgba(168, 197, 161, 0.06);
  }
  h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 34px; line-height: 1.08; letter-spacing: -0.01em; color: var(--vanilla);
  }
  .intro {
    margin: 12px auto 0; max-width: 300px; color: var(--sage);
    font-size: 14.5px; line-height: 1.45;
  }
  .adnote {
    margin: 22px auto 30px; display: flex; gap: 7px; align-items: center;
    width: 100%; justify-content: center;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--sage);
  }
  .adnote::before, .adnote::after { content: ""; height: 1px; flex: 1; background: var(--line); }
  .adnote span { white-space: nowrap; }

  /* card */
  .card {
    background: linear-gradient(180deg, rgba(26, 115, 64, 0.22), rgba(4, 89, 39, 0.18));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 20px 18px;
    margin-bottom: 18px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card {
      opacity: 0; transform: translateY(14px);
      animation: rise 0.6s var(--ease-out-quart) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }
  }

  .card-top { display: flex; align-items: center; gap: 13px; margin-bottom: 6px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: var(--vanilla); color: var(--forest-anchor);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 19px;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pname { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--vanilla); }
  .disc {
    margin-left: auto; flex: none;
    background: var(--forest-accent); color: var(--vanilla);
    font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em;
    padding: 5px 10px; border-radius: 999px;
  }
  .value { color: var(--sage); font-size: 14px; line-height: 1.5; margin: 8px 2px 16px; }

  .code-row { display: flex; gap: 9px; }
  .code {
    flex: 1; cursor: pointer; border: 1px dashed rgba(168, 197, 161, 0.45);
    background: rgba(11, 29, 18, 0.55); border-radius: 13px;
    padding: 13px 14px; text-align: left; color: var(--vanilla);
    font-family: var(--font-body);
    display: flex; flex-direction: column; gap: 2px;
    transition: border-color 0.2s, background 0.2s;
  }
  .code:hover { border-color: var(--sage); }
  .code .lbl { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); }
  .code .val { font-family: var(--font-mono); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; color: var(--vanilla); }
  .copybtn {
    flex: none; width: 50px; border: none; border-radius: 13px; cursor: pointer;
    background: rgba(168, 197, 161, 0.12); color: var(--sage);
    font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: background 0.2s, color 0.2s;
  }
  .copybtn svg { width: 17px; height: 17px; }
  .copybtn.done { background: var(--forest-primary); color: var(--vanilla); }
  .code:focus-visible, .copybtn:focus-visible, .cta:focus-visible, .flinks a:focus-visible {
    outline: 3px solid var(--forest-accent); outline-offset: 2px;
  }

  .cta {
    margin-top: 11px; display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; text-decoration: none;
    background: var(--vanilla); color: var(--forest-anchor);
    font-weight: 600; font-size: 15px;
    padding: 13px; border-radius: 13px;
    transition: transform 0.15s, background 0.2s;
  }
  .cta:active { transform: scale(0.985); }
  .cta svg { width: 15px; height: 15px; }
  .fineprint { margin: 11px 2px 0; font-size: 11px; line-height: 1.45; color: rgba(168, 197, 161, 0.7); }

  .noscript-note {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; font-size: 14px; color: var(--sage); text-align: center;
  }
  .noscript-note a { color: var(--vanilla); }

  /* visually hidden (aria-live Copy-Feedback) */
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* footer */
  footer { margin-top: 34px; text-align: center; border-top: 1px solid var(--line); padding-top: 24px; }
  .flinks { display: flex; flex-wrap: wrap; gap: 6px 0; justify-content: center; align-items: center; font-size: 13px; }
  .flinks a { color: var(--sage); text-decoration: none; padding: 0 12px; border-right: 1px solid var(--line); }
  .flinks a:last-child { border-right: none; }
  .flinks a:hover { color: var(--vanilla); }
  .copyline { margin-top: 14px; font-size: 11px; color: rgba(168, 197, 161, 0.5); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="monogram" aria-hidden="true">VH</div>
      <h1>Codes &amp; Partner</h1>
      <p class="intro">Meine Partner &amp; Codes — ehrlich ausgewählt.</p>
      <p class="adnote"><span>Werbung · Affiliate-Links</span></p>
    </header>

    <main aria-label="Partner-Rabattcodes">
      <div id="partner-cards"></div>
      <noscript>
        <p class="noscript-note">
          Die Partner-Codes brauchen JavaScript. Alternativ findest du alle aktuellen Codes
          in meinen Story-Highlights auf <a href="https://instagram.com/vegetarianhulk" rel="noopener">@vegetarianhulk</a>.
        </p>
      </noscript>
      <p class="sr-only" id="copy-status" role="status" aria-live="polite"></p>
    </main>

    <footer>
      <nav class="flinks" aria-label="Seiten-Navigation und Rechtliches">
        <a href="/">Startseite</a>
        <a href="/kooperationen.html">Für Brands</a>
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </nav>
      <p class="copyline">© <span id="footer-year">2026</span> Sebastian Wimmer · VegetarianHulk</p>
    </footer>
  </div>

<script src="partners.js?v=1"></script>
<script>
(function () {
  'use strict';

  var COPY_FEEDBACK_MS = 1400;
  var STAGGER_MS = 80;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function copyIcon() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('aria-hidden', 'true');
    var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', '9'); rect.setAttribute('y', '9');
    rect.setAttribute('width', '11'); rect.setAttribute('height', '11');
    rect.setAttribute('rx', '2');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1');
    svg.appendChild(rect); svg.appendChild(path);
    return svg;
  }

  function arrowIcon() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2.2');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M7 17 17 7M9 7h8v8');
    svg.appendChild(path);
    return svg;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var t = document.createElement('textarea');
      t.value = text;
      t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      try {
        document.execCommand('copy') ? resolve() : reject(new Error('execCommand failed'));
      } catch (err) {
        reject(err);
      } finally {
        document.body.removeChild(t);
      }
    });
  }

  function flashCopied(btn, partnerName) {
    var label = btn.querySelector('.copybtn-label');
    var status = document.getElementById('copy-status');
    btn.classList.add('done');
    label.textContent = 'OK ✓';
    if (status) status.textContent = 'Code von ' + partnerName + ' kopiert';
    setTimeout(function () {
      btn.classList.remove('done');
      label.textContent = 'Copy';
    }, COPY_FEEDBACK_MS);
  }

  function buildCard(partner, index) {
    var card = el('article', 'card');
    card.style.animationDelay = (index * STAGGER_MS) + 'ms';

    var top = el('div', 'card-top');
    var logo = el('div', 'logo');
    if (partner.logo) {
      var img = document.createElement('img');
      img.src = partner.logo;
      img.alt = partner.name + ' Logo';
      img.width = 42; img.height = 42;
      img.loading = 'lazy';
      logo.appendChild(img);
    } else {
      logo.textContent = partner.name.charAt(0);
      logo.setAttribute('aria-hidden', 'true');
    }
    top.appendChild(logo);
    top.appendChild(el('h2', 'pname', partner.name));
    if (partner.discount) {
      top.appendChild(el('span', 'disc', '–' + partner.discount));
    }
    card.appendChild(top);

    card.appendChild(el('p', 'value', partner.valueLine));

    var row = el('div', 'code-row');
    var codeBtn = el('button', 'code');
    codeBtn.type = 'button';
    codeBtn.appendChild(el('span', 'lbl', 'Code'));
    codeBtn.appendChild(el('span', 'val', partner.code));
    var copyBtn = el('button', 'copybtn');
    copyBtn.type = 'button';
    // Accessible Name muss das sichtbare "Copy" enthalten (axe: label-content-name-mismatch)
    copyBtn.setAttribute('aria-label', 'Copy — Code ' + partner.code + ' kopieren');
    copyBtn.appendChild(copyIcon());
    copyBtn.appendChild(el('span', 'copybtn-label', 'Copy'));
    function onCopy() {
      copyToClipboard(partner.code)
        .then(function () { flashCopied(copyBtn, partner.name); })
        .catch(function () {
          var status = document.getElementById('copy-status');
          if (status) status.textContent = 'Kopieren nicht möglich — Code: ' + partner.code;
        });
    }
    codeBtn.addEventListener('click', onCopy);
    copyBtn.addEventListener('click', onCopy);
    row.appendChild(codeBtn);
    row.appendChild(copyBtn);
    card.appendChild(row);

    var cta = el('a', 'cta', 'Zum ' + partner.name + ' Shop');
    cta.href = partner.shopUrl;
    cta.target = '_blank';
    cta.rel = 'nofollow sponsored noopener';
    cta.appendChild(arrowIcon());
    card.appendChild(cta);

    card.appendChild(el('p', 'fineprint',
      'Affiliate-Link: Wenn du über den Link kaufst, erhalte ich eine Provision. Für dich entstehen keine Mehrkosten.'));

    return card;
  }

  var mount = document.getElementById('partner-cards');
  if (!mount || typeof VH_PARTNERS === 'undefined') return;
  VH_PARTNERS
    .filter(function (p) { return p.active; })
    .forEach(function (p, i) { mount.appendChild(buildCard(p, i)); });
})();
</script>
<script>
(function () {
  var y = document.getElementById('footer-year');
  if (y) y.textContent = new Date().getFullYear();
})();
</script>
</body>
