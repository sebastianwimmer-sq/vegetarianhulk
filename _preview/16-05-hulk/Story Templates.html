<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vegetarianhulk · Insta Story Templates</title>
<link rel="stylesheet" href="colors_and_type.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { margin: 0; background: #f0eee9; font-family: var(--font-body); }
  #root { width: 100vw; height: 100vh; }

  /* ── Story canvas — every template is 1080×1920 ─────────────── */
  .story {
    width: 1080px; height: 1920px;
    position: relative;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font-body);
    background: var(--vanilla);
    isolation: isolate;
  }
  /* paper noise / grain — keeps it from looking "plastic AI" */
  .story::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    opacity: 0.5; mix-blend-mode: multiply; z-index: 4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0 0.06 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .aurora-bg {
    position: absolute; inset: -10%; z-index: 0;
    background: var(--gradient-aurora);
    filter: blur(20px);
    pointer-events: none;
  }

  /* ── Insta-Story chrome ─────────────────────────────────────── */
  .ig-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 56px 48px 0;
    display: flex; flex-direction: column; gap: 18px;
    z-index: 6;
  }
  .ig-progress {
    display: flex; gap: 6px;
  }
  .ig-progress span {
    flex: 1; height: 5px; border-radius: 3px; background: rgba(26,20,16,.18);
  }
  .ig-progress span.active { background: var(--ink); }
  .ig-handle {
    display: flex; align-items: center; gap: 14px;
  }
  .ig-handle .av {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--forest-3), var(--forest-2));
    border: 3px solid var(--vanilla);
    display: grid; place-items: center;
    color: var(--vanilla);
    font-family: var(--font-display); font-style: italic; font-weight: 700;
    font-size: 28px;
    box-shadow: 0 0 0 3px var(--forest-1);
  }
  .ig-handle .nm {
    font-family: var(--font-body); font-weight: 700; font-size: 22px;
    color: var(--ink); letter-spacing: -0.2px;
  }
  .ig-handle .nm em { font-style: italic; font-weight: 400; color: var(--ink-2); }
  .ig-handle .ts {
    font-size: 18px; color: var(--ink-3); font-weight: 500;
  }
  .ig-handle .grow { flex: 1; }
  .ig-handle .dots {
    color: var(--ink-2); font-size: 28px; letter-spacing: 4px; transform: translateY(-12px);
  }

  /* ── Insta-Story footer ─────────────────────────────────────── */
  .ig-foot {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 0 48px 56px;
    z-index: 6;
    display: flex; align-items: center; gap: 18px;
  }
  .ig-reply {
    flex: 1;
    padding: 22px 30px;
    border: 2px solid rgba(26,20,16,.32);
    border-radius: 999px;
    color: var(--ink-2);
    font-size: 22px; font-weight: 500;
    background: rgba(247, 239, 222, 0.4);
    backdrop-filter: blur(6px);
  }
  .ig-icon {
    width: 56px; height: 56px;
    display: grid; place-items: center;
    color: var(--ink);
  }
  .ig-icon svg { width: 38px; height: 38px; }

  /* ── Shared sticker primitives ──────────────────────────────── */
  .sticker {
    background: var(--vanilla);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 14px 22px;
    font-family: var(--font-body);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    font-size: 22px;
    color: var(--ink);
    display: inline-flex; align-items: center; gap: 12px;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .sticker.dark { background: var(--ink); color: var(--vanilla); box-shadow: 6px 6px 0 var(--forest-1); border-color: var(--ink); }
  .sticker.green { background: var(--forest-1); color: var(--vanilla); border-color: var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .pill-tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--vanilla);
    font-family: var(--font-body);
    font-weight: 800; text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 20px;
  }
  .pill-tag.green { background: var(--forest-1); }
  .pill-tag.vanilla { background: var(--vanilla); color: var(--ink); border: 2px solid var(--ink); }
  .pill-tag .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--forest-3);
    box-shadow: 0 0 0 3px rgba(61, 138, 82, 0.35);
  }
  .eyebrow-cap {
    font-family: var(--font-body);
    font-size: 22px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: var(--forest-1);
  }
  .stamp-num {
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--ink-3); text-transform: uppercase;
  }

  /* ── Marker underline (hand-feel) ───────────────────────────── */
  .marker {
    background-image: linear-gradient(120deg, var(--forest-3) 0%, var(--forest-1) 100%);
    background-size: 100% 22px;
    background-position: 0 88%;
    background-repeat: no-repeat;
    padding: 0 6px;
    color: var(--ink);
  }

  /* ── Common section anchors (centered in canvas) ───────────── */
  .story-body {
    position: absolute; inset: 220px 80px 240px;
    z-index: 5;
    display: flex; flex-direction: column;
  }

  /* ============================================================
     TEMPLATE 01 · QUICK-WIN
     ============================================================ */
  .qw {
    background: var(--vanilla);
  }
  .qw .body {
    justify-content: space-between;
  }
  .qw .num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 480px;
    line-height: 0.85;
    letter-spacing: -22px;
    color: var(--forest-1);
    text-align: left;
    margin-left: -20px;
  }
  .qw .num em {
    font-style: italic; font-weight: 400;
    color: var(--ink);
    font-size: 380px;
    letter-spacing: -16px;
  }
  .qw .num-label {
    font-family: var(--font-body);
    font-size: 28px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink-2);
    margin-top: 4px;
  }
  .qw .quote {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 76px;
    line-height: 1.08;
    color: var(--ink);
    letter-spacing: -1px;
    text-wrap: balance;
  }
  .qw .quote .marker { background-size: 100% 30px; padding: 0 8px; }
  .qw .attrib {
    margin-top: 28px;
    display: flex; align-items: center; gap: 18px;
  }
  .qw .attrib .line { flex: 0 0 56px; height: 2px; background: var(--forest-1); }
  .qw .attrib .who { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--forest-1); }
  .qw .badges {
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: auto;
  }
  .qw .photo-blob {
    position: absolute;
    right: -120px;
    top: 380px;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--forest-3), var(--forest-2) 60%, var(--ink) 110%);
    transform: rotate(-6deg);
    z-index: 2;
    box-shadow: 0 30px 60px -20px rgba(31,77,44,0.4);
  }
  .qw .photo-blob::after {
    content: "PORTRAIT"; position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--font-body); font-size: 18px; font-weight: 700;
    letter-spacing: 3px; color: rgba(247,239,222,.5);
    transform: rotate(6deg);
  }

  /* ============================================================
     TEMPLATE 02 · BIBEL-ANCHOR
     ============================================================ */
  .bb {
    background: var(--beige-1);
  }
  .bb .ig-bar { color: var(--ink); }
  .bb .body { justify-content: center; gap: 56px; padding-top: 60px; }
  .bb .glyph {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 220px;
    line-height: 0.5;
    color: var(--forest-1);
    margin: 0 auto 0 -10px;
    opacity: 0.9;
  }
  .bb .verse-text {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 78px;
    line-height: 1.18;
    color: var(--ink);
    text-wrap: balance;
    letter-spacing: -0.8px;
  }
  .bb .verse-ref {
    display: flex; align-items: center; gap: 22px;
  }
  .bb .verse-ref .line { flex: 0 0 60px; height: 2px; background: var(--forest-1); }
  .bb .verse-ref .ref {
    font-family: var(--font-body);
    font-size: 26px; font-weight: 800; letter-spacing: 3px;
    color: var(--forest-1); text-transform: uppercase;
  }
  .bb .application {
    margin-top: auto;
    padding: 32px 36px;
    background: var(--vanilla);
    border: 2px solid var(--ink);
    border-radius: 18px;
    box-shadow: 8px 8px 0 var(--forest-1);
    transform: rotate(-1.2deg);
    position: relative;
  }
  .bb .application .lbl {
    font-family: var(--font-body);
    font-size: 18px; font-weight: 800; letter-spacing: 2.5px;
    color: var(--forest-1); text-transform: uppercase;
    margin-bottom: 12px;
  }
  .bb .application .txt {
    font-family: var(--font-body);
    font-size: 32px; font-weight: 500;
    line-height: 1.32; color: var(--ink);
  }
  .bb .application .txt em { font-style: italic; color: var(--forest-1); font-weight: 600; }
  .bb .day-stamp {
    position: absolute; top: 200px; right: 60px;
    transform: rotate(4deg);
    padding: 14px 22px;
    background: var(--forest-1); color: var(--vanilla);
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 var(--ink);
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 7;
  }

  /* ============================================================
     TEMPLATE 03 · PLANT-STACK
     ============================================================ */
  .ps {
    background: var(--vanilla);
  }
  .ps .photo {
    position: absolute;
    top: 220px; left: 80px; right: 80px;
    height: 820px;
    border-radius: 32px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 30% 20%, #6fa67d, #3d8a52 50%, #1f4d2c 100%);
    border: 2px solid var(--ink);
    box-shadow: 12px 12px 0 var(--ink);
    z-index: 3;
  }
  .ps .photo::before {
    /* faux veg arrangement — circles for bowls */
    content: "";
    position: absolute;
    inset: 30% 20% 20% 25%;
    background:
      radial-gradient(circle at 30% 60%, #b6c97a 0 90px, transparent 92px),
      radial-gradient(circle at 70% 40%, #d4a85a 0 70px, transparent 72px),
      radial-gradient(circle at 55% 75%, #c95a4a 0 60px, transparent 62px),
      radial-gradient(circle at 80% 70%, #8aa657 0 50px, transparent 52px);
    opacity: 0.92;
    filter: blur(0.5px);
  }
  .ps .photo-stamp {
    position: absolute; top: 24px; left: 24px;
    padding: 10px 18px;
    background: rgba(26, 20, 16, 0.85); color: var(--vanilla);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 16px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .ps .photo-label {
    position: absolute; bottom: 28px; left: 28px; right: 28px;
    color: var(--vanilla);
    font-family: var(--font-display); font-style: italic;
    font-weight: 400; font-size: 50px; line-height: 1.05;
    letter-spacing: -1px; text-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .ps .meta {
    position: absolute; top: 220px; right: 80px;
    z-index: 4;
    transform: rotate(3deg) translateY(-30px);
  }
  .ps .macros {
    position: absolute;
    left: 80px; right: 80px;
    bottom: 240px;
    z-index: 5;
    background: var(--ink);
    color: var(--vanilla);
    border-radius: 24px;
    padding: 36px 44px;
    border: 2px solid var(--ink);
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 28px;
  }
  .ps .macros .col {
    display: flex; flex-direction: column; gap: 6px;
    text-align: left;
  }
  .ps .macros .col + .col { border-left: 1px solid rgba(247,239,222,.18); padding-left: 24px; }
  .ps .macros .num {
    font-family: var(--font-display);
    font-weight: 700; font-size: 64px; letter-spacing: -2px;
    color: var(--forest-3); line-height: 1;
  }
  .ps .macros .lbl {
    font-family: var(--font-body);
    font-size: 16px; font-weight: 700; letter-spacing: 2.5px;
    color: rgba(247,239,222,.65); text-transform: uppercase;
  }
  .ps .macros .unit {
    font-family: var(--font-body); font-weight: 600;
    font-size: 22px; color: var(--vanilla);
  }

  /* ============================================================
     TEMPLATE 04 · BUILD-UPDATE
     ============================================================ */
  .bu {
    background: var(--ink); color: var(--vanilla);
  }
  .bu::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(80% 60% at 20% 0%, rgba(45,106,62,.42), transparent 60%),
                radial-gradient(60% 50% at 90% 100%, rgba(61,138,82,.28), transparent 60%);
    pointer-events: none;
  }
  .bu .ig-bar { color: var(--vanilla); }
  .bu .ig-bar .ig-progress span { background: rgba(247,239,222,.22); }
  .bu .ig-bar .ig-progress span.active { background: var(--vanilla); }
  .bu .ig-handle .nm { color: var(--vanilla); }
  .bu .ig-handle .nm em { color: rgba(247,239,222,.6); }
  .bu .ig-handle .ts { color: rgba(247,239,222,.55); }
  .bu .ig-handle .dots { color: var(--vanilla); }
  .bu .ig-foot .ig-reply { color: rgba(247,239,222,.7); border-color: rgba(247,239,222,.32); background: rgba(247,239,222,.05); }
  .bu .ig-foot .ig-icon { color: var(--vanilla); }

  .bu .build-eyebrow {
    display: flex; align-items: center; gap: 18px; margin-bottom: 24px;
  }
  .bu .build-eyebrow .dot {
    width: 14px; height: 14px; border-radius: 50%; background: #6dd687;
    box-shadow: 0 0 0 6px rgba(109,214,135,.18);
    animation: pulse 2.4s var(--ease-apple) infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .bu .build-eyebrow .lbl {
    font-family: var(--font-body); font-weight: 800;
    font-size: 24px; letter-spacing: 3px; text-transform: uppercase;
    color: #6dd687;
  }
  .bu .build-eyebrow .num { font-family: var(--font-mono); font-size: 22px; color: rgba(247,239,222,.55); margin-left: auto; }

  .bu .why {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 80px;
    line-height: 1.05;
    color: var(--vanilla);
    letter-spacing: -1.6px;
    text-wrap: balance;
    max-width: 760px;
  }
  .bu .why em { font-style: italic; font-weight: 400; color: #6dd687; }
  .bu .why-sub {
    font-family: var(--font-body); font-weight: 500;
    font-size: 26px; line-height: 1.5;
    color: rgba(247,239,222,.65); margin-top: 24px;
    max-width: 700px;
  }

  .bu .phone-wrap {
    position: relative; align-self: center;
    margin-top: 56px;
    transform: rotate(-3deg);
  }
  .bu .phone-frame {
    width: 540px; height: 1100px;
    background: #0a0a0a;
    border-radius: 60px;
    padding: 22px;
    box-shadow: 0 60px 100px -30px rgba(0,0,0,.7),
                0 0 0 2px #333 inset,
                30px 30px 0 var(--forest-2);
    position: relative;
  }
  .bu .phone-screen {
    width: 100%; height: 100%;
    background: #050505;
    border-radius: 42px;
    overflow: hidden;
    padding: 56px 36px;
    box-sizing: border-box;
    display: flex; flex-direction: column; gap: 24px;
    color: #f0f0f0;
  }
  .bu .ps-eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.5px; color: #888; text-transform: uppercase; }
  .bu .ps-h {
    font-family: var(--font-body);
    font-size: 56px; font-weight: 900; letter-spacing: -1.4px; line-height: 1; color: #f0f0f0;
  }
  .bu .ps-h em { font-style: italic; font-weight: 400; color: #00ff6a; }
  .bu .ps-habit {
    display: flex; align-items: center; gap: 18px;
    background: #111; border: 1px solid #222; border-radius: 22px;
    padding: 22px 24px;
  }
  .bu .ps-habit .check {
    width: 44px; height: 44px; border-radius: 11px;
    background: #00ff6a; color: #050505;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 900;
  }
  .bu .ps-habit .check.empty { background: transparent; border: 2.5px solid #222; }
  .bu .ps-habit .emoji { font-size: 32px; }
  .bu .ps-habit .name { flex: 1; font-size: 24px; font-weight: 800; color: #f0f0f0; }
  .bu .ps-habit .tag { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: #888; }
  .bu .ps-habit .streak { font-size: 22px; font-weight: 900; color: #00ff6a; display: flex; align-items: center; gap: 6px; }

  .bu .tags {
    position: absolute;
    left: 80px; bottom: 200px;
    z-index: 7;
    display: flex; flex-direction: column; gap: 14px;
  }
  .bu .tag-hash {
    align-self: flex-start;
    padding: 14px 22px;
    background: var(--vanilla); color: var(--ink);
    border-radius: 14px;
    font-family: var(--font-body); font-weight: 800;
    font-size: 22px; letter-spacing: 1.5px;
    text-transform: lowercase;
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 #6dd687;
    transform: rotate(-2deg);
  }
  .bu .tag-hash.alt { background: #6dd687; transform: rotate(2deg); box-shadow: 4px 4px 0 var(--vanilla); }

  /* ============================================================
     TEMPLATE 05 · AFFILIATE-DM-TRIGGER
     ============================================================ */
  .af {
    background: var(--vanilla);
  }
  .af .werbung {
    position: absolute; top: 130px; right: 56px;
    padding: 10px 18px;
    background: var(--vanilla);
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-family: var(--font-body); font-weight: 800;
    font-size: 18px; letter-spacing: 2px;
    color: var(--ink); text-transform: uppercase;
    z-index: 7;
    transform: rotate(2deg);
    box-shadow: 4px 4px 0 var(--forest-1);
  }
  .af .product {
    position: absolute;
    top: 240px; left: 50%; transform: translateX(-50%) rotate(-2deg);
    width: 620px; height: 740px;
    z-index: 3;
    background: linear-gradient(180deg, var(--beige-2), var(--earth));
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 16px 16px 0 var(--forest-1);
    padding: 24px;
    display: flex; flex-direction: column;
  }
  .af .product .prod-bottle {
    flex: 1;
    background: linear-gradient(180deg, #6e8a4a 0 38%, #4a6e30 38% 70%, #3a5824 70% 100%);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    border: 2px solid var(--ink);
  }
  .af .product .prod-bottle::before {
    content: ""; position: absolute;
    left: 20%; right: 20%; top: 0; height: 14%;
    background: var(--ink);
    border-radius: 0 0 12px 12px;
  }
  .af .product .prod-bottle .label {
    position: absolute; left: 14%; right: 14%; top: 38%; bottom: 22%;
    background: var(--vanilla); border: 2px solid var(--ink);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px;
    text-align: center;
  }
  .af .product .prod-bottle .label .top {
    font-family: var(--font-body); font-size: 14px; font-weight: 800;
    letter-spacing: 2.5px; color: var(--forest-1); text-transform: uppercase;
  }
  .af .product .prod-bottle .label .name {
    font-family: var(--font-display); font-weight: 700;
    font-size: 44px; letter-spacing: -1.5px; color: var(--ink);
    line-height: 0.95;
  }
  .af .product .prod-bottle .label .sub {
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    letter-spacing: 1.5px; color: var(--ink-2); text-transform: uppercase;
  }

  .af .cta-stack {
    position: absolute;
    left: 80px; right: 80px;
    bottom: 220px;
    z-index: 6;
