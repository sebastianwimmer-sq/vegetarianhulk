<!DOCTYPE html><html><head><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="gap:18px">
  <div class="grid-4">
    <div><div style="height:80px;background:#efe5cf;border:1px solid #cfbf9d;border-radius:8px"></div><div style="margin-top:8px"><div style="font-size:12px;font-weight:700;color:#1a1410">Chip</div><div class="val-mono">8px</div></div></div>
    <div><div style="height:80px;background:#efe5cf;border:1px solid #cfbf9d;border-radius:12px"></div><div style="margin-top:8px"><div style="font-size:12px;font-weight:700;color:#1a1410">Button</div><div class="val-mono">12px</div></div></div>
    <div><div style="height:80px;background:#efe5cf;border:1px solid #cfbf9d;border-radius:20px"></div><div style="margin-top:8px"><div style="font-size:12px;font-weight:700;color:#1a1410">Card</div><div class="val-mono">20px</div></div></div>
    <div><div style="height:80px;background:#efe5cf;border:1px solid #cfbf9d;border-radius:24px"></div><div style="margin-top:8px"><div style="font-size:12px;font-weight:700;color:#1a1410">Image</div><div class="val-mono">24px</div></div></div>
    <div><div style="height:40px;width:120px;background:#2d6a3e;border-radius:999px"></div><div style="margin-top:8px"><div style="font-size:12px;font-weight:700;color:#1a1410">Pill</div><div class="val-mono">999px</div></div></div>
  </div>

  <div class="hairline"></div>

  <div class="label">Spacing scale · 4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 56 / 80 / 120</div>
  <div style="display:flex;align-items:flex-end;gap:10px">
    <div style="width:4px;height:14px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:8px;height:22px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:12px;height:32px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:16px;height:44px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:20px;height:54px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:24px;height:66px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:32px;height:78px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:40px;height:90px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:56px;height:108px;background:#2d6a3e;border-radius:2px"></div>
    <div style="width:80px;height:130px;background:#2d6a3e;border-radius:2px"></div>
  </div>
</div>
</body></html>
