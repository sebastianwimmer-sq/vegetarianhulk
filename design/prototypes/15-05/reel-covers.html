<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vegetarianhulk · Reel‑Cover Templates</title>
<link rel="stylesheet" href="colors_and_type.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { margin: 0; background: #f0eee9; font-family: var(--font-body); }
  #root { width: 100vw; height: 100vh; }

  /* ─── Reel canvas — 1080×1920 ─────────────── */
  .reel {
    width: 1080px; height: 1920px;
    position: relative;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font-body);
    background: var(--vanilla);
    isolation: isolate;
  }
  /* Anti-AI-Plastic: paper grain overlay (warm noise, multiply blend) */
  .reel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    opacity: 0.55; mix-blend-mode: multiply; z-index: 8;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12 0 0 0 0 0.09 0 0 0 0 0.06 0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* Optional: feed-grid safe-zone reference (visible only when class added) */
  .reel.show-safe::before {
    content: ""; position: absolute;
    left: 0; right: 0; top: 420px; height: 1080px;
    border: 2px dashed rgba(45,106,62,.45);
    z-index: 9; pointer-events: none;
  }

  /* Magazine masthead — every cover gets this */
  .masthead {
    position: absolute; top: 56px; left: 56px; right: 56px;
    z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 22px; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 22px;
  }
  .masthead .left, .masthead .right { display: flex; align-items: center; gap: 14px; }
  .masthead .dot {
    width: 14px; height: 14px; border-radius: 50%; background: var(--forest-1);
  }
  .masthead.inverse { color: var(--vanilla); border-color: rgba(247,239,222,.6); }
  .masthead.inverse .dot { background: var(--forest-3); box-shadow: 0 0 0 3px rgba(61,138,82,.3); }

  /* Bottom @wordmark — every cover */
  .wordmark-bottom {
    position: absolute; left: 56px; right: 56px; bottom: 56px;
    z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 22px;
    border-top: 2px solid var(--ink);
    color: var(--ink);
  }
  .wordmark-bottom .handle {
    font-family: var(--font-display);
    font-style: italic; font-weight: 700;
    font-size: 38px; letter-spacing: -0.5px;
    color: var(--forest-1);
  }
  .wordmark-bottom .handle em { font-style: normal; font-weight: 400; color: var(--ink); }
  .wordmark-bottom .issue {
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 600; letter-spacing: 1px;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .wordmark-bottom.inverse { border-color: rgba(247,239,222,.5); color: var(--vanilla); }
  .wordmark-bottom.inverse .handle { color: var(--forest-3); }
  .wordmark-bottom.inverse .handle em { color: var(--vanilla); }
  .wordmark-bottom.inverse .issue { color: rgba(247,239,222,.55); }

  /* Eyebrow pill */
  .eyebrow-pill {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 22px;
    border: 2px solid var(--forest-1);
    border-radius: 999px;
    background: var(--vanilla);
    font-family: var(--font-body);
    font-size: 22px; font-weight: 800;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--forest-1);
  }
  .eyebrow-pill .num {
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 700;
    color: var(--ink);
    letter-spacing: 1.2px;
  }
  .eyebrow-pill .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--forest-1);
  }

  /* Marker underline */
  .marker {
    background-image: linear-gradient(120deg, var(--forest-3), var(--forest-1));
    background-size: 100% 28px;
    background-position: 0 90%;
    background-repeat: no-repeat;
    padding: 0 10px;
  }
  .marker-dark {
    background-image: linear-gradient(120deg, var(--forest-3), var(--forest-1));
    background-size: 100% 28px;
    background-position: 0 90%;
    background-repeat: no-repeat;
    padding: 0 10px;
    color: var(--vanilla);
  }

  /* ============================================================
     COVER 01 · DISZIPLIN — Hot-take + sebi-selfie BG
     ============================================================ */
  .c-disz {
    background: var(--ink);
    color: var(--vanilla);
  }
  .c-disz .selfie {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 50% at 50% 38%, #5a4a3a 0%, #2d2017 55%, #0a0805 110%);
    z-index: 1;
  }
  .c-disz .selfie::after {
    /* faux silhouette of a head/shoulders — a soft oval */
    content: "";
    position: absolute;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    width: 540px; height: 720px;
    background:
      radial-gradient(ellipse 50% 38% at 50% 32%, #6b5a48 0%, #382920 65%, transparent 70%),
      radial-gradient(ellipse 70% 58% at 50% 78%, #382920 0%, transparent 70%);
    opacity: 0.7;
    filter: blur(1.5px);
  }
  .c-disz .tint {
    position: absolute; inset: 0; z-index: 2;
    background:
      linear-gradient(180deg, rgba(10,8,5,.62) 0%, rgba(10,8,5,.35) 45%, rgba(10,8,5,.85) 100%);
  }
  .c-disz .selfie-stamp {
    position: absolute;
    top: 740px; right: 56px;
    z-index: 4;
    transform: rotate(4deg);
    padding: 8px 16px;
    background: var(--vanilla); color: var(--ink);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase;
    box-shadow: 4px 4px 0 var(--forest-1);
    border: 1.5px solid var(--ink);
  }
  .c-disz .hook-wrap {
    position: absolute;
    left: 56px; right: 56px;
    top: 280px;
    z-index: 5;
  }
  .c-disz .eyebrow-pill {
    background: transparent;
    color: var(--vanilla);
    border-color: var(--forest-3);
  }
  .c-disz .hook {
    font-family: var(--font-body);
    font-weight: 900;
    font-size: 220px;
    line-height: 0.86;
    letter-spacing: -8px;
    color: var(--vanilla);
    text-transform: uppercase;
    margin-top: 28px;
    text-wrap: balance;
  }
  .c-disz .hook .underline-word {
    position: relative;
    display: inline-block;
    color: var(--vanilla);
  }
  .c-disz .hook .underline-word::after {
    content: "";
    position: absolute;
    left: -8px; right: -8px;
    bottom: -2px;
    height: 22px;
    background: var(--forest-1);
    z-index: -1;
    transform: skew(-4deg);
  }
  .c-disz .hook em {
    font-style: italic;
    font-weight: 400;
    color: var(--forest-3);
    font-family: var(--font-display);
    letter-spacing: -4px;
  }
  .c-disz .take {
    position: absolute;
    left: 56px; right: 200px;
    bottom: 280px;
    z-index: 5;
    font-family: var(--font-display);
    font-style: italic; font-weight: 400;
    font-size: 44px;
    line-height: 1.18;
    color: var(--vanilla);
    text-wrap: balance;
    max-width: 720px;
  }
  .c-disz .take em { color: var(--forest-3); font-weight: 600; font-style: normal; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 2px; font-size: 28px; }
  .c-disz .masthead { color: var(--vanilla); border-color: rgba(247,239,222,.4); }
  .c-disz .masthead .dot { background: var(--forest-3); }

  /* ============================================================
     COVER 02 · FAITH — Bibel-Vers
     ============================================================ */
  .c-faith {
    background: var(--vanilla);
  }
  .c-faith .aurora-wash {
    position: absolute; inset: 0; z-index: 1;
    background:
      radial-gradient(70% 60% at 50% 25%, rgba(61,138,82,.20), transparent 70%),
      radial-gradient(60% 50% at 80% 80%, rgba(45,106,62,.14), transparent 65%);
    pointer-events: none;
  }
  .c-faith .cross {
    position: absolute;
    left: 50%; top: 360px;
    transform: translateX(-50%);
    z-index: 3;
    width: 120px; height: 168px;
    opacity: 0.85;
  }
  .c-faith .cross::before, .c-faith .cross::after {
    content: ""; position: absolute;
    background: var(--forest-1);
    border-radius: 4px;
  }
  .c-faith .cross::before {
    left: 50%; top: 0; transform: translateX(-50%);
    width: 18px; height: 100%;
  }
  .c-faith .cross::after {
    left: 0; top: 36%;
    width: 100%; height: 18px;
  }
  .c-faith .verse-block {
    position: absolute;
    left: 90px; right: 90px;
    top: 600px;
    z-index: 5;
    text-align: center;
  }
  .c-faith .verse {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 96px;
    line-height: 1.08;
    letter-spacing: -1.8px;
    color: var(--ink);
    text-wrap: balance;
  }
  .c-faith .verse .accent {
    color: var(--forest-1);
    font-weight: 600;
  }
  .c-faith .verse-rule {
    display: flex; align-items: center; gap: 24px;
    justify-content: center;
    margin-top: 48px;
  }
  .c-faith .verse-rule .line {
    flex: 0 0 80px; height: 2px; background: var(--forest-1);
  }
  .c-faith .verse-rule .ref {
    font-family: var(--font-body);
    font-size: 28px; font-weight: 800;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--forest-1);
  }
  .c-faith .application-tag {
    position: absolute;
    left: 56px; right: 56px;
    bottom: 200px;
    z-index: 5;
    text-align: center;
    font-family: var(--font-display);
    font-style: italic; font-weight: 400;
    font-size: 32px;
    color: var(--ink-2);
    text-wrap: balance;
  }
  .c-faith .application-tag em {
    font-style: normal; font-weight: 800;
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--forest-1);
    font-size: 22px;
  }
  .c-faith .corner-stamp {
    position: absolute; top: 200px; right: 56px;
    z-index: 5;
    transform: rotate(6deg);
    padding: 12px 20px;
    background: var(--vanilla);
    border: 2px solid var(--ink);
    border-radius: 8px;
    box-shadow: 5px 5px 0 var(--forest-1);
    font-family: var(--font-mono);
    font-size: 16px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink);
  }

  /* ============================================================
     COVER 03 · PLANT+STARK — Meal close-up + macro
     ============================================================ */
  .c-plant {
    background: var(--vanilla);
  }
  .c-plant .meal {
    position: absolute; inset: 0;
    z-index: 1;
    filter: saturate(0.85) brightness(0.96);
    background:
      /* warm bowl */
      radial-gradient(ellipse 70% 55% at 50% 56%, #6a4128 0%, #4a2a18 60%, #2d1a0d 100%),
      /* outer wood texture */
      linear-gradient(135deg, #8b6f4a, #5a4528);
  }
  .c-plant .meal::after {
    /* faux food: oats + berries + nuts */
    content: ""; position: absolute;
    inset: 22% 18% 28% 18%;
    background:
      /* berry cluster A */
      radial-gradient(circle at 30% 35%, #8b2030 0 60px, transparent 62px),
      radial-gradient(circle at 35% 28%, #a83040 0 38px, transparent 40px),
      radial-gradient(circle at 26% 42%, #6a1a25 0 32px, transparent 34px),
      /* berry cluster B */
      radial-gradient(circle at 72% 38%, #6a8038 0 56px, transparent 58px),
      radial-gradient(circle at 78% 30%, #8aa845 0 40px, transparent 42px),
      /* oat base ring */
      radial-gradient(circle at 50% 65%, #c9a878 0 200px, transparent 202px),
      radial-gradient(circle at 50% 65%, #b8956a 0 180px, transparent 182px),
      /* nut */
      radial-gradient(circle at 52% 50%, #c4a060 0 26px, transparent 28px),
      radial-gradient(circle at 60% 70%, #d4b074 0 22px, transparent 24px);
    opacity: 0.96;
    filter: blur(0.5px);
  }
  .c-plant .meal-tint {
    position: absolute; inset: 0; z-index: 2;
    background:
      linear-gradient(180deg, rgba(247,239,222,.0) 40%, rgba(247,239,222,.86) 100%),
      linear-gradient(180deg, rgba(26,20,16,.55) 0%, rgba(26,20,16,0) 35%);
  }
  .c-plant .stack-eyebrow {
    position: absolute;
    left: 56px; top: 200px;
    z-index: 5;
  }
  .c-plant .stack-eyebrow .eyebrow-pill {
    background: var(--vanilla);
    border-color: var(--forest-1);
    color: var(--forest-1);
    font-size: 26px;
    padding: 14px 24px;
  }
  .c-plant .macro-stack {
    position: absolute;
    left: 56px; right: 56px;
    bottom: 240px;
    z-index: 6;
  }
  .c-plant .macro-line {
    font-family: var(--font-body);
    font-size: 32px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 12px;
  }
  .c-plant .macro-line em { color: var(--forest-1); font-style: normal; }
  .c-plant .macro-num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 380px;
    line-height: 0.84;
    letter-spacing: -14px;
    color: var(--ink);
    display: flex; align-items: flex-end; gap: 12px;
    margin-left: -10px;
  }
  .c-plant .macro-num .unit {
    font-family: var(--font-display);
    font-style: italic; font-weight: 400;
    font-size: 160px;
    color: var(--forest-1);
    letter-spacing: -4px;
    line-height: 1;
    padding-bottom: 18px;
  }
  .c-plant .macro-num .emoji {
    font-size: 180px;
    line-height: 1;
    padding-bottom: 24px;
    margin-left: 8px;
  }
  .c-plant .meal-name {
    margin-top: 18px;
    font-family: var(--font-display);
    font-style: italic; font-weight: 400;
    font-size: 38px;
    color: var(--ink-2);
    line-height: 1.1;
    max-width: 700px;
  }
  .c-plant .meal-tag {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    background: var(--ink); color: var(--vanilla);
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 18px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .c-plant .meal-tag .v { color: var(--forest-3); }

  /* ============================================================
     COVER 04 · MACHER / BUILD-IN-PUBLIC — Editorial mag vibe
     ============================================================ */
  .c-mach {
    background: var(--beige-1);
  }
  .c-mach .ed-rule {
    position: absolute; left: 56px; right: 56px;
    top: 240px;
    z-index: 4;
    display: flex; align-items: center; gap: 18px;
  }
  .c-mach .ed-rule .num {
    font-family: var(--font-display);
    font-style: italic; font-weight: 400;
    font-size: 56px; color: var(--forest-1);
    line-height: 1;
  }
  .c-mach .ed-rule .label {
    font-family: var(--font-body);
    font-size: 22px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--forest-1);
  }
  .c-mach .ed-rule .dash {
    flex: 1; height: 1.5px; background: var(--forest-1);
  }
  .c-mach .ed-rule .meta {
    font-family: var(--font-mono);
    font-size: 18px; font-weight: 600; letter-spacing: 1px;
    color: var(--ink-3); text-transform: uppercase;
  }
  .c-mach .hook-h {
    position: absolute; left: 56px; right: 540px;
    top: 340px;
    z-index: 5;
  }
  .c-mach .hook-h h1 {
    font-family: var(--font-body);
    font-weight: 900;
    font-size: 200px;
    line-height: 0.84;
    letter-spacing: -7px;
    color: var(--ink);
    text-transform: uppercase;
    text-wrap: balance;
  }
  .c-mach .hook-h h1 em {
    font-style: italic; font-weight: 400;
    color: var(--forest-1);
    font-family: var(--font-display);
    letter-spacing: -3px;
  }
  .c-mach .lede {
    position: absolute; left: 56px; right: 540px;
    top: 1180px;
    z-index: 5;
    font-family: var(--font-display);
    font-style: italic; font-weight: 400;
    font-size: 40px;
    line-height: 1.18;
    color: var(--ink);
    text-wrap: balance;
    border-top: 2px solid var(--ink);
    padding-top: 24px;
  }
  .c-mach .lede em { font-style: normal; font-weight: 800; font-family: var(--font-body); color: var(--forest-1); text-transform: uppercase; letter-spacing: 2px; font-size: 26px; }

  .c-mach .phone-side {
    position: absolute;
    right: 24px;
    top: 380px;
    z-index: 4;
    width: 480px;
    transform: rotate(3deg);
  }
  .c-mach .phone-frame {
    width: 100%; height: 1000px;
    background: #0a0a0a;
    border-radius: 56px;
    padding: 20px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.4),
                0 0 0 2px #333 inset,
                24px 24px 0 var(--forest-1);
    border: 2px solid var(--ink);
  }
  .c-mach .phone-screen {
    width: 100%; height: 100%;
    background: #050505;
    border-radius: 40px;
    overflow: hidden;
    padding: 44px 28px;
    box-sizing: border-box;
    display: flex; flex-direction: column; gap: 18px;
    color: #f0f0f0;
  }
  .c-mach .ps-eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.5px; color: #888; text-transform: uppercase; }
  .c-mach .ps-h {
    font-family: var(--font-body);
    font-size: 44px; font-weight: 900; letter-spacing: -1.2px; line-height: 1; color: #f0f0f0;
  }
  .c-mach .ps-h em { font-style: italic; font-weight: 400; color: #00ff6a; font-family: var(--font-display); }
  .c-mach .ps-habit {
    display: flex; align-items: center; gap: 14px;
    background: #111; border: 1px solid #222; border-radius: 18px;
    padding: 18px 20px;
  }
  .c-mach .ps-habit .check {
    width: 36px; height: 36px; border-radius: 10px;
    background: #00ff6a; color: #050505;
    display: grid; place-items: center;
    font-size: 22px; font-weight: 900;
  }
  .c-mach .ps-habit .check.empty { background: transparent; border: 2px solid #222; }
  .c-mach .ps-habit .emoji { font-size: 24px; }
  .c-mach .ps-habit .name { flex: 1; font-size: 20px; font-weight: 800; color: #f0f0f0; }
  .c-mach .ps-habit .streak { font-size: 18px; font-weight: 900; color: #00ff6a; }

  .c-mach .day-badge {
    position: absolute;
    left: 56px;
    bottom: 280px;
    z-index: 6;
    padding: 14px 22px;
    background: var(--ink); color: var(--vanilla);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 20px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
    transform: rotate(-1.5deg);
    box-shadow: 5px 5px 0 var(--forest-1);
    border: 2px solid var(--ink);
  }
  .c-mach .day-badge .num {
    color: var(--forest-3);
    font-family: var(--font-display);
    font-style: italic; font-weight: 700;
    font-size: 24px;
    margin-left: 4px;
  }

</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { DesignCanvas: DC_Root, DCSection: DC_Sec, DCArtboard: DC_Art } = window;

/* ─── Magazine masthead (top) ─── */
const Masthead = ({ inverse = false, issue = 'REELS · MAI 2026', tag = 'Disziplin' }) => (
  <div className={'masthead' + (inverse ? ' inverse' : '')}>
    <div className="left">
      <span className="dot"></span>
      <span>vegetarianhulk · Reel № 12</span>
    </div>
    <div className="right">
      <span>{tag}</span>
    </div>
  </div>
);

/* ─── Bottom wordmark ─── */
const WordmarkBottom = ({ inverse = false, issue = 'TAG 1.247 · 10 J. PLANT‑BASED' }) => (
  <div className={'wordmark-bottom' + (inverse ? ' inverse' : '')}>
    <div className="handle">@vegetarian<em>hulk</em></div>
    <div className="issue">{issue}</div>
  </div>
);

/* ============================================================
   COVER 01 · DISZIPLIN — „996 IST KRANK"
