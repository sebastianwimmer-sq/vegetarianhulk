<!DOCTYPE html><html><head><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="gap:16px">
  <div class="grid-4">
    <div>
      <div style="height:96px;background:#2d6a3e;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Primary Forest</div>
        <div class="val-mono">#2D6A3E</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#1f4d2c;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Deeper Forest</div>
        <div class="val-mono">#1F4D2C</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#3d8a52;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Aurora Forest</div>
        <div class="val-mono">#3D8A52</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:linear-gradient(135deg,#2d6a3e,#1f4d2c);border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Forest Gradient</div>
        <div class="val-mono">135° · 1 → 2</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#f7efde;border-radius:14px;border:1px solid #cfbf9d"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Vanilla Canvas</div>
        <div class="val-mono">#F7EFDE</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#efe5cf;border-radius:14px;border:1px solid #cfbf9d"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Beige Surface</div>
        <div class="val-mono">#EFE5CF</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#e6d9bd;border-radius:14px;border:1px solid #cfbf9d"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Beige Hover</div>
        <div class="val-mono">#E6D9BD</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#cfbf9d;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Earth Border</div>
        <div class="val-mono">#CFBF9D</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#1a1410;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Ink</div>
        <div class="val-mono">#1A1410</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#4a3f33;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Ink 2</div>
        <div class="val-mono">#4A3F33</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#807260;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Ink 3 / Muted</div>
        <div class="val-mono">#807260</div>
      </div>
    </div>
    <div>
      <div style="height:96px;background:#b3a385;border-radius:14px"></div>
      <div style="margin-top:10px">
        <div style="font-size:13px;font-weight:700;color:#1a1410">Ink 4 / Stamp</div>
        <div class="val-mono">#B3A385</div>
      </div>
    </div>
  </div>
</div>
</body></html>
