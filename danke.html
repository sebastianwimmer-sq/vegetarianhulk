<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Danke · vegetarianhulk</title>
<link rel="stylesheet" href="style.css?v=v30.5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a3d28'/><text x='50' y='68' text-anchor='middle' font-size='55' font-weight='900' font-family='Georgia,serif' fill='%23f7efde'>v</text></svg>">
</head>
<body>
<main class="main" style="max-width:640px;margin:0 auto;padding:60px 24px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center">
  <div style="font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--green1);font-weight:800;margin-bottom:14px">— Notiert. —</div>
  <h1 id="thanks-title" style="font-family:'Playfair Display',Georgia,serif;font-size:clamp(34px,7vw,52px);font-weight:900;line-height:1.05;letter-spacing:-1px;color:var(--text);margin-bottom:18px">Danke.</h1>
  <p id="thanks-sub" style="font-size:clamp(16px,2.8vw,19px);line-height:1.55;color:var(--text2);max-width:480px;margin:0 auto 28px">Ich weiß jetzt was dich am meisten trifft. Bekommst ab und zu was dazu in der Inbox — kein Spam, kein Funnel.</p>

  <div id="tag-detail" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:480px;margin:0 auto 28px;text-align:left;font-size:14px;line-height:1.7;color:var(--text);display:none">
    <div id="tag-eyebrow" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--green1);margin-bottom:8px"></div>
    <div id="tag-headline" style="font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:900;color:var(--green-deep);margin-bottom:10px;line-height:1.2"></div>
    <div id="tag-body" style="color:var(--text2)"></div>
  </div>

  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">
    <a href="https://instagram.com/vegetarianhulk" style="background:var(--green1);color:var(--bg);padding:14px 24px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px;letter-spacing:.5px">📲 Auf Insta folgen</a>
    <a href="/" style="background:transparent;color:var(--green1);border:1.5px solid var(--green1);padding:13px 24px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px;letter-spacing:.5px">← Zurück</a>
  </div>

  <div style="margin-top:40px;font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-weight:700">Sebi · @vegetarianhulk · 10 Jahre vegetarisch</div>
  <div style="margin-top:20px;font-size:11px;color:var(--text3)"><a href="/impressum.html" style="color:inherit;text-decoration:none">Impressum</a> · <a href="/datenschutz.html" style="color:inherit;text-decoration:none">Datenschutz</a></div>
</main>

<script>
const params = new URLSearchParams(location.search);
const tag = params.get('tag');

const TAG_CONTENT = {
  discipline: {
    eyebrow: 'Pillar — Disziplin',
    headline: 'Du willst die Architektur, die dich trägt.',
    body: 'Disziplin ist kein Talent. Sie ist ein Ritual. Ich schick dir die nächsten Wochen das was bei mir wirklich funktioniert — Morgen-Routine, Streak-Recovery, Comeback-Patterns. Keine Coach-Bro-Sprüche.',
  },
  vegetarian: {
    eyebrow: 'Pillar — Vegetarisch + Stark',
    headline: 'Du willst den Live-Beweis sehen.',
    body: '10 Jahre vegetarisch, 9 Jahre im Gym. Ich teile was wirklich auf dem Teller landet — Macros, einfache Routinen, was 2016 angefangen hat und heute noch trägt. Plant-based + Kraft = kein Widerspruch.',
  },
  faith: {
    eyebrow: 'Pillar — Faith',
    headline: 'Du willst den tieferen Anker.',
    body: 'Faith trifft Disziplin. Bibel-Verse die mich tragen, Sunday-Reset-Routinen, Anker-Praxis. Schlachter 2000. Nicht performativ — gelebt. Du musst nicht christ sein um mitzulesen.',
  },
};

if (tag && TAG_CONTENT[tag]) {
  const c = TAG_CONTENT[tag];
  document.getElementById('tag-eyebrow').textContent = c.eyebrow;
  document.getElementById('tag-headline').textContent = c.headline;
  document.getElementById('tag-body').textContent = c.body;
  document.getElementById('tag-detail').style.display = 'block';
  document.getElementById('thanks-title').textContent = 'Notiert.';
  document.getElementById('thanks-sub').textContent = 'Ich passe meine Mails an das was dich gerade trägt an.';
}
</script>
</body>
</html>
