<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@600;700;800&display=swap');
:root{--vanilla:#f7efde;--beige:#efe5cf;--earth:#cfbf9d;--ink:#1a1410;--ink2:#5c513f;--primary:#045927;--accent:#1a7340;}
*{box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:var(--vanilla);margin:0;min-height:360px;position:relative;
background-image:radial-gradient(ellipse 100% 55% at 50% -6%,rgba(4,89,39,.06),transparent 60%);}
.brand{position:absolute;top:22px;left:26px;font-weight:900;letter-spacing:2.5px;font-size:13px;color:#122d1c}
.brand .a{color:var(--accent)}
.caption{position:absolute;top:70px;left:26px;font-size:12px;color:var(--ink2);max-width:280px}
/* floating nav */
.nav{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;
padding:6px 26px;border:1px solid rgba(150,130,92,.5);border-radius:16px;
background:linear-gradient(180deg,#f8f0e0,#eddfc5);
box-shadow:inset 0 0 0 3px rgba(247,239,222,1),inset 0 0 0 3.5px rgba(150,130,92,.5),0 1px 2px rgba(18,45,28,.1),0 10px 22px -8px rgba(18,45,28,.24);}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:6px 4px 4px;color:var(--ink2);text-decoration:none}
.slot svg{width:24px;height:24px}
.slot .l{font-size:10px;font-weight:600;letter-spacing:.5px}
.slot.center{min-width:66px}
.slot.center .mtn{width:68px;height:54px;margin-top:-40px;filter:drop-shadow(0 1px 1px rgba(15,42,26,.30)) drop-shadow(0 8px 11px rgba(15,42,26,.18)) drop-shadow(0 16px 22px rgba(15,42,26,.13))}
.slot.center .l{color:var(--primary);font-weight:700;margin-top:5px}
.slot.active{color:var(--primary)}
</style></head><body>
<div class="brand">VEGETARIAN<span class="a">HULK</span></div>
<div class="caption">Floating Bottom-Nav — immer sichtbar (Insta/WhatsApp-Prinzip). Center = Hulk Hikes, der Berg bricht aus der Bar aus.</div>

<nav class="nav">

  <a class="slot" href="#"><span style="font-family:'Playfair Display',serif;font-size:14px;font-weight:600;letter-spacing:-.5px;height:24px;display:grid;place-items:center">P&amp;P</span><span class="l">Partner</span></a>
  <a class="slot center active" href="#">
    <span class="mtn"><svg viewBox="0 0 72 56" fill="none"><defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f9457"/><stop offset="1" stop-color="#0f2a1a"/></linearGradient></defs><path d="M0 55 17 27l11 12 9-9 15 15 20-9v20z" fill="#347e4f" opacity=".5"/><path d="M4 55 27 13l10 16 7-10 24 36z" fill="url(#m)"/><path d="M27 13l4.6 7.5-4.6 2.6-4.3-2.1z" fill="#f4ead4"/><path d="M44 19l3.3 5-3.3 1.9-3-1.5z" fill="#f4ead4"/></svg></span>
    <span class="l">Hulk&nbsp;Hikes</span>
  </a>

</nav>
</body></html>
