<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@600;700;800&display=swap');
:root{--vanilla:#f7efde;--grad:radial-gradient(135% 105% at 22% 10%,rgba(96,214,152,.34),rgba(96,214,152,0) 56%),radial-gradient(120% 120% at 90% 100%,rgba(4,40,22,.55),rgba(4,40,22,0) 60%),linear-gradient(152deg,#1c7a45 0%,#045927 50%,#081c12 100%);}
*{box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:var(--vanilla);margin:0;padding:40px}
.hero{max-width:900px;margin:0 auto;border-radius:22px;overflow:hidden;text-align:center;color:#f4ead4;
padding:60px 30px;background:var(--grad);box-shadow:0 12px 34px -14px rgba(15,42,26,.55)}
.badge{display:inline-flex;align-items:center;gap:7px;margin:0 0 20px;font-size:11px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:rgba(247,239,222,.9);background:rgba(247,239,222,.14);border:1px solid rgba(247,239,222,.28);padding:6px 14px;border-radius:999px}
.mtn{width:120px;height:92px;margin:0 auto 8px;display:block}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(2.6rem,8vw,4.6rem);line-height:1;margin:0}
.sub{margin:16px auto 0;max-width:460px;color:rgba(247,239,222,.88);font-size:18px;line-height:1.55}
</style></head><body>
<section class="hero">
  <span class="badge">In Arbeit · Bald hier</span>
  <svg class="mtn" viewBox="0 0 120 92" fill="none"><path d="M2 90 30 44l16 20 14-18 22 26 34-38v56z" fill="rgba(247,239,222,.14)"/><path d="M6 90 44 22l16 26 12-16 40 58z" fill="rgba(247,239,222,.95)"/><path d="M44 22l7 11.4-7 4-6.6-3.2z" fill="#0f2a1a"/><path d="M72 32l5 8-5 3-4.6-2.4z" fill="#0f2a1a"/></svg>
  <h1>Hulk Hikes</h1>
  <p class="sub">Meine Wege in die Berge — ehrlich eingestuft, zum Nachwandern. Bald hier mit GPX, Höhenprofil und Karte.</p>
</section>
</body></html>
