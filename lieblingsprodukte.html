<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=/">

<title>Umleitung · vegetarianhulk</title>
<meta name="description" content="Die Lieblingsprodukte-Seite wurde archiviert. Weiter zur Startseite.">
<meta name="theme-color" content="#f7efde">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232d6a3e'/%3E%3Ctext x='50' y='66' font-family='Inter,sans-serif' font-size='52' font-weight='900' text-anchor='middle' fill='%23fff'%3EV%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --vanilla: #f7efde;
    --beige-1: #efe5cf;
    --earth: #cfbf9d;
    --forest-1: #2d6a3e;
    --forest-2: #1f4d2c;
    --ink: #1a1410;
    --ink-2: #4a3f33;
    --ink-3: #807260;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--vanilla);
    color: var(--ink);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    min-height: 100dvh;
  }
  .stub-wrap {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .stub-card {
    max-width: 480px;
    text-align: center;
  }
  .stub-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--forest-1);
    letter-spacing: -0.4px;
    margin-bottom: 28px;
  }
  .stub-brand em { font-style: italic; font-weight: 400; color: var(--ink); }
  .stub-eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--forest-1);
    margin-bottom: 16px;
  }
  .stub-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.1;
    letter-spacing: -1px;
    color: var(--ink);
    margin: 0 0 16px;
    text-wrap: balance;
  }
  .stub-title em { font-style: italic; font-weight: 400; color: var(--forest-1); }
  .stub-sub {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-2);
    margin: 0 0 28px;
  }
  .stub-link {
    display: inline-block;
    padding: 13px 26px;
    background: var(--forest-1);
    color: var(--vanilla);
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.3px;
    text-decoration: none;
    transition: background 0.2s ease;
  }
  .stub-link:hover, .stub-link:focus-visible { background: var(--forest-2); }
  .stub-meta {
    margin-top: 24px;
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-2);
  }
</style>
</head>
<body>
<main class="stub-wrap">
  <div class="stub-card">
    <div class="stub-brand">vegetarian<em>hulk</em></div>
    <div class="stub-eyebrow">— Umgezogen —</div>
    <h1 class="stub-title">Lieblingsprodukte sind grad <em>woanders</em>.</h1>
    <p class="stub-sub">
      Die Seite wurde archiviert. Du wirst gleich zur Startseite weitergeleitet.
    </p>
    <a class="stub-link" href="/">→ Zur Startseite</a>
    <div class="stub-meta">Falls nichts passiert · klick oben</div>
  </div>
</main>
<script>
  // Backup-Redirect falls meta-refresh blockiert
  window.location.replace('/');
</script>
</body>
</html>
