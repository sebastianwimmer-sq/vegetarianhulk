name: 🏔️ Launch Reveal (v3 live schalten)

# Schaltet zum Geburtstags-Launch die verschlüsselte v3 auf `main` (GitHub Pages).
#   • Cron          -> 15.08.2026 18:00 CEST (= 16:00 UTC) automatisch
#   • workflow_dispatch mode=launch  -> 1-Klick-Backup für den exakten Moment
#   • workflow_dispatch mode=dry-run -> testet Key + Entschlüsselung OHNE live zu gehen
# Quelle = release/v3.tar.gz.enc (AES-256), Key = Actions-Secret RELEASE_KEY.

on:
  schedule:
    - cron: '40 15 15 8 *'   # 15. August 15:40 UTC = 17:40 CEST (still, 20 Min vor Story-Moment 18:00)
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (nur testen) oder launch (live schalten)'
        required: true
        type: choice
        default: dry-run
        options: [dry-run, launch]

permissions:
  contents: write

concurrency:
  group: launch-reveal
  cancel-in-progress: false

env:
  TARGET_UTC: '2026-08-15T15:40:00Z'   # 17:40 CEST — Cron darf nicht früher deployen
  ENC_FILE: release/v3.tar.gz.enc

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Modus + Zeit-Gate bestimmen
        id: gate
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MODE="launch"   # Cron = echter Launch
            NOW=$(date -u +%s); TARGET=$(date -u -d "${TARGET_UTC}" +%s)
            echo "Cron. Jetzt(UTC)=$(date -u) Ziel=${TARGET_UTC}"
            if [ "$NOW" -lt "$TARGET" ]; then
              echo "::error::Cron feuerte vor dem Ziel-Zeitpunkt — kein früher Reveal."; exit 1
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modus: $MODE"

      - name: Repo (main / Coming-Soon) auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v3 entschlüsseln + entpacken
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          set -e
          if [ -z "$RELEASE_KEY" ]; then echo "::error::Secret RELEASE_KEY fehlt."; exit 1; fi
          if [ ! -f "$ENC_FILE" ]; then echo "::error::$ENC_FILE nicht gefunden."; exit 1; fi
          printf '%s' "$RELEASE_KEY" > "$RUNNER_TEMP/rk"
          mkdir -p "$RUNNER_TEMP/release"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in "$ENC_FILE" -out "$RUNNER_TEMP/v3.tar.gz" -pass file:"$RUNNER_TEMP/rk"
          tar xzf "$RUNNER_TEMP/v3.tar.gz" -C "$RUNNER_TEMP/release"
          rm -f "$RUNNER_TEMP/rk"
          echo "Entpackt nach $RUNNER_TEMP/release"

      - name: Sanity-Check der entschlüsselten Seite
        run: |
          set -e
          IDX="$RUNNER_TEMP/release/index.html"
          [ -f "$IDX" ] || { echo "::error::index.html fehlt im Release."; exit 1; }
          grep -qE 'stage-cut|quote__by' "$IDX" || { echo "::error::index.html ist nicht die v3-Hero."; exit 1; }
          [ -f "$RUNNER_TEMP/release/v3.css" ] || { echo "::error::v3.css fehlt."; exit 1; }
          echo "✅ Sanity ok: v3-Hero + v3.css vorhanden."

      - name: Dry-Run — Ergebnis
        if: steps.gate.outputs.mode == 'dry-run'
        run: echo "🧪 DRY-RUN erfolgreich. Key + Entschlüsselung funktionieren. NICHTS wurde live geschaltet."

      - name: Sicherungs-Tag der Coming-Soon-Seite
        if: steps.gate.outputs.mode == 'launch'
        run: |
          set -e
          git tag -f pre-reveal-backup HEAD
          git push -f origin pre-reveal-backup
          echo "Backup-Tag pre-reveal-backup = bisheriger main-Stand gesetzt."

      - name: Reveal — v3 auf main schalten
        if: steps.gate.outputs.mode == 'launch'
        run: |
          set -e
          git config user.name "vh-launch-bot"
          git config user.email "info@vegetarianhulk.de"
          # Arbeitsbaum leeren (ausser .git), v3 reinlegen
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/release/." .
          git add -A
          git commit -m "🏔️ Reveal: v3 ist live (Geburtstags-Launch 15.08.2026)"
          git push origin HEAD:main
          echo "🏔️ v3 gepusht. GitHub Pages baut jetzt — Countdown-Seite lädt beim Besucher automatisch nach."
