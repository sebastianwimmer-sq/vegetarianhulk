# Nimmt Saison-Schilder am Wegweiser (vegetarianhulk.de/links) nach ihrem letzten
# Tag von selbst ab (Sebi 16.11.2026: das Wichteln soll sich Anfang Dezember selbst
# archivieren). Das Datum steht am Schild selbst: <li data-bis="JJJJ-MM-TT">.
# Nur in der Saison (November bis Januar), sonst liefe der Lauf das ganze Jahr leer.
name: Saison-Schilder
on:
  schedule:
    - cron: '23 3 * 11,12,1 *'   # täglich 03:23 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saison-schilder
  cancel-in-progress: false
jobs:
  abnehmen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Selbsttest
        run: python3 scripts/saison-schilder.py --selbsttest
      - name: Abgelaufene Schilder abnehmen
        run: TZ=Europe/Berlin python3 scripts/saison-schilder.py
      - name: Veroeffentlichen, wenn sich etwas geaendert hat
        run: |
          if git diff --quiet -- links/index.html; then echo "keine Aenderung"; exit 0; fi
          git config user.name "saison-schilder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links/index.html
          git commit -m "chore(links): Saison-Schild abgenommen"
          git pull --rebase origin main
          git push origin HEAD:main
